# 测试环境默认关掉 outbox 流水线的"自动跑"（定时轮询 + API 侧消费线程）：
# 否则每个缓存的 @SpringBootTest 上下文都会起定时器/线程、互相抢 cg-timeline 消费组。
# 需要它的测试类用 @SpringBootTest(properties = "feed.outbox.auto=true") 单独打开。
feed.outbox.auto=false

# 测试上下文默认关限流：套件一轮的注册/登录次数远超真额度（注册 5/小时、登录 10/分钟），
# 而计数器与线上共享同一个 Redis——不关的话套件自己把 127.0.0.1 打穿、大批 429（2026-10-07 全量 33 红）。
# 限流专测 RateLimitTest 用 @SpringBootTest(properties = "feed.ratelimit.enabled=true") 单独打开。
feed.ratelimit.enabled=false
